<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Admin Authentication Hub</title>
    <!-- Gagamit tayo ng offline Bootstrap at FontAwesome para sa premium widgets -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 🌌 COPYING THE EXACT LUXURY STAGE THEATRE THEME MATRICES */
        body { 
            background: #020617 url('jsa.jfif') no-repeat center center fixed !important;
            background-size: cover !important;
            color: #ffffff !important; 
            min-height: 100vh !important; 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.65); z-index: 1; pointer-events: none;
        }

        /* 🔒 PREMIUM FROSTED TRANSLUCENT GLASS BOX SECURE GATE PANEL */
        .auth-glass-box {
             background: rgba(255, 255, 255, 0.08) !important;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            width: 92%;
            max-width: 26rem;
            text-align: center;
            position: relative;
            z-index: 5;
             box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
        }

        .portal-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0;
        }

        .portal-subtitle {
            font-size: 0.78rem;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 2px;
            margin-bottom: 2rem;
            border-bottom: 1px dashed rgba(251, 191, 36, 0.25);
            padding-bottom: 0.75rem;
        }

        .form-section-wrapper {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-label-custom {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            display: block;
        }

        input {
            background-color: #ffffff !important;
            border: 2px solid #cbd5e1 !important;
            color: #0f172a !important;
            width: 100%;
            padding: 0.75rem 1.25rem !important;
            border-radius: 2rem !important;
            font-size: 0.95rem !important;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #fbbf24 !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5) !important;
        }
        .btn-gold-submit {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 50%, #b45309 100%) !important;
            border: 1px solid #92400e !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            width: 100% !important;
            padding: 0.85rem !important;
            border-radius: 2rem !important;
            letter-spacing: 0.1em;
            font-size: 1.05rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
            margin-top: 1rem;
            box-shadow: 0 6px 20px rgba(180, 83, 9, 0.45);
            cursor: pointer;
        }
        .btn-gold-submit:hover {
            background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%) !important;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
        }

        .footer-link-back {
            display: inline-block;
            margin-top: 1.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: 0.2s;
        }
        .footer-link-back:hover { color: #fbbf24; }
    </style>
</head>
<body>

    <div class="auth-glass-box">
        <!-- THE CENTER LOGO EMBLEM ICON -->
        <div style="font-size: 2.2rem; color: #fbbf24; margin-bottom: 0.25rem; filter: drop-shadow(0 0 10px rgba(245,158,11,0.3));"><i class="fa-solid fa-user-shield"></i></div>
        
        <h1 class="portal-title">Administrator</h1>
        <div class="portal-subtitle">Secure Gateway Auth Hub</div>

        <!-- THE SECURE SEPARATE DUAL FORM INTRUSIONS -->
        <form id="adminLoginForm">
            <div class="form-section-wrapper">
                <label class="form-label-custom"><i class="fa-solid fa-user me-1 text-warning"></i> Admin Username</label>
                <input type="text" id="adminUsername" placeholder="Enter username..." required autocomplete="off">
            </div>

            <div class="form-section-wrapper">
                <label class="form-label-custom"><i class="fa-solid fa-lock me-1 text-warning"></i> Secure Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password..." required>
            </div>

            <button type="submit" class="btn-gold-submit">Verify Credentials</button>
        </form>

        <a href="admin.html" class="footer-link-back"><i class="fa-solid fa-arrow-left me-1"></i> Return to Judges Portal</a>
    </div>
    <!-- REAL-TIME DISPATCH HANDSHAKE VALIDATION HANDLERS -->
    <script>
         // ✅ CLOUD TRANSMISSION ROUTE: Nakaturo na sa inyong magiging live Render backend gateway safely!
        const cloudBackendUrl =  "https://jsa-tabulation-system-1.onrender.com";
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const userField = document.getElementById('adminUsername').value.trim();
            const passField = document.getElementById('adminPassword').value;

            // 🔐 EXTRA SEPARATED SECURITY GATE CONTROLLERS:
            // Saktong credential keys na gagamitin mo at ng propesor mo para makapasok
            if (userField === "admin" && passField === "admin123") {
                sessionStorage.setItem('admin_authenticated', 'true');
                alert("✨ ACCESS GRANTED: Tabulation center authorization verified successfully!");
                window.location.href = "admin-board.html"; // Papasok na sa main dashboard screen ninyo!
            } else {
                alert("❌ ACCESS DENIED: Invalid administrator username or password combination. Verification failed.");
                document.getElementById('adminPassword').value = ''; // Nililinisan ang password field
            }
        });
    </script>
</body>
</html>
