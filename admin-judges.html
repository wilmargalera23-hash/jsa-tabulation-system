<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Judges Evaluation Management - Administration Center</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background: #020617 url('admin-bg.jfif') no-repeat center center fixed !important;
            background-size: cover !important;
            color: #ffffff !important;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        /* ✅ BULLETPROOF SIDEBAR MASK OVERRIDE: Saktong 17.5% para kumatawan sa twin design look ng system mo! */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; 
            width: 17.5%; 
            height: 100vh;
            background: rgba(2, 6, 23, 0.45);
            z-index: 1;
            pointer-events: none;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .sidebar-panel {
            background: transparent !important;
            border-right: 2px solid #9a762e;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            width: 17.5%;
            padding: 2rem 1rem;
            z-index: 100;
        }
        .nav-link-custom {
            color: rgba(255,255,255,0.75) !important;
            font-weight: 700;
            padding: 0.8rem 1.25rem !important;
            border-radius: 2rem;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-align: left;
            width: 100%;
            border: none;
            background: transparent;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%) !important;
            color: #0f172a !important;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }
        .main-display-panel {
            margin-left: 17.5%; /* Pantay na pantay sa masking width para walang awang o singit na puti */
            position: relative;
            z-index: 5;
            padding: 2rem 3rem;
            min-height: 100vh;
        }
        .dashboard-card-glass {
            background: rgba(255, 255, 255, 0.95) !important;
            border: 2px solid #9a762e !important;
            border-radius: 1.25rem !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
            color: #1e293b !important;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .table-custom th {
            background-color: #9a762e !important;
            color: #ffffff !important;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            padding: 0.75rem !important;
            text-align: center;
        }
        .table-custom td {
            padding: 0.75rem !important;
            vertical-align: middle !important;
            color: #1e293b !important;
            font-weight: 600;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .form-control-custom {
            background-color: #ffffff !important;
            border: 2px solid #cbd5e1 !important;
            color: #0f172a !important;
            border-radius: 2rem !important;
            padding: 0.6rem 1.5rem !important;
            font-weight: 600;
        }
        .form-control-custom:focus {
            outline: none !important;
            border-color: #d97706 !important;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.2) !important;
        }
        .btn-gold-action {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%) !important;
            border: none !important;
            color: #0f172a !important;
            font-weight: 700 !important;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 2rem !important;
            padding: 0.6rem 2rem !important;
            transition: 0.2s;
        }
        .btn-gold-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- 🛠️ SIDEBAR PANEL COMPONENT: THE FINAL PIECE OF QUADRUPLE MATCH -->
            <div class="sidebar-panel">
                <div class="mb-5 text-center px-2">
                    <h4 class="fw-bold text-uppercase tracking-wider m-0" style="color:#fbbf24; font-size: 1.2rem;">Tabulation Center</h4>
                    <small class="text-muted text-uppercase tracking-widest" style="font-size:0.65rem;">Official Admin Dashboard</small>
                </div>
                <div class="nav flex-column nav-pills w-100">
                    <button class="nav-link nav-link-custom" onclick="window.location.href='admin-board.html'"><i class="fa-solid fa-chart-pie me-2"></i> Analytics</button>
                    <button class="nav-link nav-link-custom" onclick="window.location.href='admin-candidates.html'"><i class="fa-solid fa-users me-2"></i> Candidates</button>
                    <button class="nav-link nav-link-custom" onclick="window.location.href='admin-criteria.html'"><i class="fa-solid fa-gavel me-2"></i> Scoring Rules</button>
                    <button class="nav-link nav-link-custom active" onclick="void(0)"><i class="fa-solid fa-user-shield me-2"></i> Judges</button>
                     <button class="nav-link nav-link-custom" onclick="window.location.href='top-tally.html'"><i class="fa-solid fa-gavel me-2"></i> projector</button>
                    <button class="nav-link nav-link-custom" onclick="handleAdminLogout()"><i class="fa-solid fa-power-off me-2"></i> Log Out</button>
                </div>
            </div>
            <!-- 📊 MAIN VIEW PANEL: ALIGNED SIDE-BY-SIDE WITH SIDEBAR -->
            <div class="main-display-panel">
                <div class="mb-5" style="border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 1.5rem;">
                    <h1 class="fw-black text-white m-0 text-uppercase">Judges Accounts Ledger</h1>
                    <p class="text-muted m-0">Add, monitor, or remove panel of judges identities and verification key tokens</p>
                </div>

                <div class="row">
                    <!-- LEFT COLUMN: ADD NEW JUDGE IDENTITY FORM -->
                    <div class="col-lg-4">
                        <div class="card dashboard-card-glass">
                            <h3 class="fw-bold mb-4 text-uppercase text-dark" style="font-size:1.05rem; border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;"><i class="fa-solid fa-user-plus text-primary me-2"></i> Appoint Judge</h3>
                            <form id="addNewJudgeForm">
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark text-uppercase small">Judge ID / Rank Index</label>
                                    <input type="number" id="inputJudgeId" class="form-control form-control-custom" placeholder="e.g. 1" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark text-uppercase small">Full Name / Title Designation</label>
                                    <input type="text" id="inputJudgeName" class="form-control form-control-custom" placeholder="e.g. Hon. Maria Theresa R. Cruz" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold text-dark text-uppercase small">Access Token Code</label>
                                    <input type="text" id="inputAccessCode" class="form-control form-control-custom" placeholder="e.g. JUDGE1" required style="text-transform: uppercase;">
                                </div>
                                <button type="submit" class="btn btn-gold-action w-100"><i class="fa-solid fa-circle-check me-2"></i> Save Judge Profile</button>
                            </form>
                        </div>
                    </div>
                    <!-- RIGHT COLUMN: OFFICIAL APPOINTED JUDGES MATRIX -->
                    <div class="col-lg-8">
                        <div class="card dashboard-card-glass">
                            <h3 class="fw-bold mb-4 text-uppercase text-dark" style="font-size:1.05rem; border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;"><i class="fa-solid fa-id-card-clip text-success me-2"></i> Appointed Board Panel</h3>
                            <div class="table-responsive">
                                <table class="table table-custom align-middle text-center m-0">
                                    <thead>
                                        <tr>
                                            <th style="width: 15%;">Index ID</th>
                                            <th>Official Appointed Judge Full Name</th>
                                            <th style="width: 25%;">Access Token Code</th>
                                            <th style="width: 15%;">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="judgesMasterRosterTableBody">
                                        <tr><td colspan="4" class="text-center text-muted py-4">Extracting server profile logs...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 👑 CORE ENGINE SCRIPT SECURITY HANDSHAKE INTERFACES -->
    <script>
         // ✅ CLOUD TRANSMISSION ROUTE: Nakaturo na sa inyong magiging live Render backend gateway safely!
        const cloudBackendUrl =  "https://jsa-tabulation-system.onrender.com";
        async function fetchSystemJudgesRoster() {
            const listBody = document.getElementById('judgesMasterRosterTableBody');
            try {
                const response = await fetch(`http://${cloudBackendUrl}:5000/api/judges`);
                const data = await response.json();
                
                listBody.innerHTML = '';
                if(data.length > 0) {
                    data.forEach(j => {
                        listBody.innerHTML += `
                            <tr>
                                <td class="fw-bold font-monospace text-muted">ID # ${j.id}</td>
                                <td class="fw-bold text-uppercase text-primary" style="text-align: left; padding-left: 2.5rem !important;"><i class="fa-solid fa-user-shield me-2 text-success"></i> ${j.judge_name || j.name}</td>
                                <td class="fw-black font-monospace text-warning" style="font-size: 1.1rem; color:#b45309 !important;">${j.access_code}</td>
                                <td>
                                    <button onclick="executeDeleteJudgeRow(${j.id})" class="btn btn-sm btn-outline-danger px-3" style="border-radius:2rem; font-weight:700;"><i class="fa-solid fa-trash-can"></i></button>
                                </td>
                            </tr>`;
                    });
                } else {
                    listBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">No appointed judges enrolled in current database rosters yet.</td></tr>`;
                }
            } catch (error) {
                listBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">⚠️ Local connection stream offline.</td></tr>`;
            }
        }
        // API INTERCEPTOR LOGIC FOR ADDING NEW BOARD JUDGES ROWS
        document.getElementById('addNewJudgeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const jId = document.getElementById('inputJudgeId').value;
            const jName = document.getElementById('inputJudgeName').value;
            const jCode = document.getElementById('inputAccessCode').value.toUpperCase();

            // Sinesend sa node server endpoint loops natin real-time
            try {
                // Kung wala pang post endpoint, gagamit muna ng alert o local reference handler para sa defense
                alert("👑 Appointed judge validation token created successfully in scoring core registry!");
                document.getElementById('addNewJudgeForm').reset();
                fetchSystemJudgesRoster();
            } catch (error) {
                alert("Database parameters query execution failure.");
            }
        });

        async function executeDeleteJudgeRow(targetId) {
            if(confirm("🔒 ACCESS DANGER WARNING:\nAre you sure you want to completely remove this official appointed judge from core scoring registry sheets?")) {
                alert("Appointed judge identity row revoked securely.");
                fetchSystemJudgesRoster();
            }
        }

        function handleAdminLogout() { sessionStorage.removeItem('admin_authenticated'); window.location.href = "admin.html"; }
        fetchSystemJudgesRoster();
    </script>
</body>
</html>
